name: Release

# Push a tag like v3.0.1 to build, verify and publish a signed APK.
# Repo secrets: GRADATION_KEYSTORE_BASE64 (base64 of gradation-release.jks), GRADATION_STORE_PASSWORD,
# GRADATION_KEY_ALIAS, GRADATION_KEY_PASSWORD. The tag must match the version in app/build.gradle.kts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Without the signing secrets the release is built and published locally (docs/RELEASING.md),
  # so the build job is skipped instead of failing on every tag.
  check:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - id: key
        env:
          KEYSTORE_B64: ${{ secrets.GRADATION_KEYSTORE_BASE64 }}
        run: echo "has_key=$([ -n "$KEYSTORE_B64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.GRADATION_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "GRADATION_KEYSTORE_BASE64 secret is not set" >&2; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gradation-release.jks"
      - name: Build, sign and verify
        env:
          GRADATION_STORE_FILE: ${{ runner.temp }}/gradation-release.jks
          GRADATION_STORE_PASSWORD: ${{ secrets.GRADATION_STORE_PASSWORD }}
          GRADATION_KEY_ALIAS: ${{ secrets.GRADATION_KEY_ALIAS }}
          GRADATION_KEY_PASSWORD: ${{ secrets.GRADATION_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^val appVersionMajor" app/build.gradle.kts
          scripts/release.sh
          test -f "build-out/gradation-$VERSION.apk" || { echo "tag $GITHUB_REF_NAME does not match the built version" >&2; ls build-out; exit 1; }
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-out/gradation-*.apk
            build-out/gradation-*.apk.sha256
          generate_release_notes: true
